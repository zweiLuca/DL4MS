# ============================
# CONFIG: Change settings here
# ============================

seed: 1234567 # Matriculation number Luca Martin

paths:
  project_root: "."
  dataset_root: "./coding_task_data/EuroSAT_RGB"

splits:
  split_dir: "splits"
  train_size: 10000
  train: "train.txt"
  train_ms: "train_ms.txt"
  val_size: 5000
  val: "val.txt"
  val_ms: "val_ms.txt"
  test_size: 5000
  test: "test.txt"
  test_ms: "test_ms.txt"

training:
  batch_size: 16 # Set the batch size for each training epoch
  num_epochs: 20 # Set the number of epochs
  learning_rate: 0.0001 # Set the learning rate

reproduce:
  save_logits: False

hardware:
  num_workers: 4
  device: "auto" # "cuda", "cpu", or "auto"

outputs:
  model_dir: "outputs/models"
  output_dir: "outputs"
